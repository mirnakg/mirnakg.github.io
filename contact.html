<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact — Mirna Kheir Gouda</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#f0ece3; --fg:#000000; --muted:#000000; --border:#c0bbb0; --accent:#2a52cc; }
    html, body { min-height:100vh; background:var(--bg); font-size: clamp(13px, 2.2vw, 22px); font-family:'IBM Plex Mono',monospace; color:var(--fg); font-size:clamp(13px,2.2vw,22px); }
    nav {
      display: flex;
      gap: clamp(2rem,5vw,4rem);
      font-size: clamp(13px,2.2vw,22px);
      letter-spacing: 0.10em;
      text-transform: uppercase;
    }
    nav a { color: #1a1a1a; font-weight: 700; text-decoration: none; transition: color 0.2s; }
    nav a:hover { color: #2a52cc; }
    nav a.active { color: #2a52cc; }
    .site-id { font-size:clamp(13px,2.2vw,22px); letter-spacing:0.10em; text-transform:uppercase; color:#1a1a1a; font-weight:700; text-decoration:none; transition:color 0.2s; }

    main { max-width:1360px; margin:0 auto; padding:3rem clamp(1.5rem,5vw,3rem) 5rem; }
    .page-label { font-size:0.75em; letter-spacing:0.3em; text-transform:uppercase; color:#000000; margin-bottom:2rem; display:block; }
    h1 { font-size:clamp(1.5rem,2.8vw,2rem); font-weight:700; letter-spacing:0.05em; line-height:1.3; margin-bottom:2.5rem; }

    /* social links */
    .links {
      display:flex;
      flex-direction:column;
      gap:0.8rem;
      margin-bottom:3rem;
    }
    .link-item {
      display:flex;
      align-items:center;
      gap:1rem;
      text-decoration:none;
      color:var(--fg);
      font-size:1em;
      letter-spacing:0.05em;
      padding:0.9rem 0;
      border-bottom:1px solid var(--border);
      transition:color 0.2s;
    }
    .link-item:first-child { border-top:1px solid var(--border); }
    .link-item:hover { color:var(--accent); }
    .link-label {
      font-size:0.7em;
      letter-spacing:0.25em;
      text-transform:uppercase;
      color:#000000;
      min-width:80px;
    }
    .link-item:hover .link-label { color:var(--accent); }
    .arrow { margin-left:auto; font-size:0.85em; color:#000000; }

    /* form */
    .form-title {
      font-size:0.75em;
      letter-spacing:0.3em;
      text-transform:uppercase;
      color:#000000;
      margin-bottom:1.5rem;
      display:block;
    }
    .field { margin-bottom:1.4rem; }
    label {
      display:block;
      font-size:0.7em;
      letter-spacing:0.25em;
      text-transform:uppercase;
      color:#000000;
      margin-bottom:0.5rem;
    }
    input, textarea {
      width:100%;
      background:transparent;
      border:none;
      border-bottom:1.5px solid var(--border);
      padding:0.5rem 0;
      font-family:'IBM Plex Mono',monospace;
      font-size:1em;
      color:var(--fg);
      letter-spacing:0.04em;
      outline:none;
      transition:border-color 0.2s;
      resize:none;
    }
    input:focus, textarea:focus { border-color:var(--fg); }
    textarea { min-height:220px; }
    button {
      margin-top:1rem;
      background:var(--fg);
      color:var(--bg);
      border:none;
      padding:0.8em 2em;
      font-family:'IBM Plex Mono',monospace;
      font-size:0.75em;
      letter-spacing:0.25em;
      text-transform:uppercase;
      cursor:pointer;
      transition:opacity 0.2s;
    }
    button:hover { opacity:0.8; }
    .success {
      display:none;
      margin-top:1rem;
      font-size:0.75em;
      letter-spacing:0.1em;
      color:var(--accent);
    }
    .error {
      display:none;
      margin-top:1rem;
      font-size:0.75em;
      letter-spacing:0.1em;
      color:#c0392b;
    }
    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: clamp(0.8rem,2vw,1.4rem) clamp(1rem,4vw,2.5rem);
      background: var(--bg);
      border-bottom: 1.5px dashed var(--border);
    }
    @media (max-width: 600px) {
      .site-header { flex-wrap: wrap; gap: 0.5rem; }
      .site-id { width: 100%; }
      nav { flex-wrap: wrap; gap: 0.8rem 1.5rem; }
    }
  </style>
</head>
<body>
<header class="site-header"><a class="site-id" href="index.html">MKG</a><nav>
  <a href="about.html">About</a>
  <a href="projects.html">Projects</a>
  <a href="https://scholar.google.com/citations?user=FP2j7tcAAAAJ&hl=en" target="_blank">Publications</a>
  <a href="blog.html">Blog</a>
  <a href="contact.html" class="active">Contact</a>
</nav></header>


<main>
  <h1>Get in touch</h1>

  <!-- Social / contact links -->
  <div class="links">
    <a class="link-item" href="https://linkedin.com/in/mirna-kheir-gouda-828428ab" target="_blank">
      <span class="link-label">LinkedIn</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
      <span class="arrow">↗</span>
    </a>
    <a class="link-item" href="https://github.com/mirnakg" target="_blank">
      <span class="link-label">GitHub</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
      <span class="arrow">↗</span>
    </a>
  </div>

  <!-- Message form -->
  <span class="form-title">Or leave a message</span>

  <div class="field">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" placeholder="Your name" required/>
  </div>
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="your@email.com" required/>
  </div>
  <div class="field">
    <label for="msg">Message</label>
    <textarea id="msg" name="message" placeholder="atgaccagctcactggtattcacgcaggtgaacccgcttgtgggatatcgtaagtgggatctggaacatggaccacacgcaaaaggcatctgggcatgactgagccacgctcaaactagggttatgttagactactgactctgcagcttcagccctcatggtgcctatgtagccggtgcgaataaatgacctggtcctagggcaaagcacgcggacacatgagtttactaaatagtctcttcatcttggttcaccgaactgtcccgagaatctgtacgatgttccgcaggcgggctaa" required></textarea>
  </div>
  <button id="submit-btn" onclick="handleSubmit()">Send message</button>
  <div class="success" id="success">Message received — thank you.</div>
  <div class="error" id="error">Something went wrong — please try again.</div>
</main>

<script>
  async function handleSubmit(){
    const name  = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const msg   = document.getElementById('msg').value.trim();
    if(!name||!email||!msg) return;

    const btn = document.getElementById('submit-btn');
    btn.textContent = 'Sending...';
    btn.style.opacity = '0.6';
    btn.style.pointerEvents = 'none';

    try {
      const res = await fetch('https://formspree.io/f/xkopvebb', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ name, email, message: msg })
      });

      if(res.ok){
        document.getElementById('success').style.display = 'block';
        document.getElementById('error').style.display   = 'none';
        document.getElementById('name').value  = '';
        document.getElementById('email').value = '';
        document.getElementById('msg').value   = '';
        btn.textContent = 'Sent';
      } else {
        throw new Error('Failed');
      }
    } catch(e){
      document.getElementById('error').style.display   = 'block';
      document.getElementById('success').style.display = 'none';
      btn.textContent = 'Send message';
      btn.style.opacity = '1';
      btn.style.pointerEvents = 'auto';
    }
  }
</script>
